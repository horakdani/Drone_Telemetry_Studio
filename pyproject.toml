[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-telemetry-studio"
version = "0.1.0"
description = "Burn DJI drone telemetry (speed, altitude, GPS, heading) and a live route map onto your MP4 videos. Free, local, private macOS app."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Drone Telemetry Studio contributors" }]
keywords = ["dji", "drone", "telemetry", "srt", "overlay", "hud", "ffmpeg", "gps", "osd", "video"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video :: Conversion",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "Pillow>=12.0,<13",
  "PySide6>=6.10,<6.11",
]

[project.urls]
Homepage = "https://horakdani.github.io/Telemetry_Overlay/"
Repository = "https://github.com/horakdani/Telemetry_Overlay"
Issues = "https://github.com/horakdani/Telemetry_Overlay/issues"
Changelog = "https://github.com/horakdani/Telemetry_Overlay/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "PyInstaller>=6.16,<7",
  "pytest>=8.4,<10",
]

[project.scripts]
drone-telemetry-studio = "drone_telemetry_studio.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

