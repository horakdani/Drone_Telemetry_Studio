name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: drone
    attributes:
      label: Drone model and firmware
      placeholder: e.g. DJI Mini 4 Pro, firmware 01.00.0500
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Output of `./scripts/verify_environment.sh`, plus macOS version and Mac model (Apple Silicon or Intel).
      render: text
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: Click **Open Log** in the app, or look in `~/Library/Application Support/DroneTelemetryStudio/logs/`.
      render: text
